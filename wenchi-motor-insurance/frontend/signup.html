<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Wenchi Motor Insurance</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/local-icons.css" />
  <!-- Local icon set mapped to the existing Font Awesome class names for offline use. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html" aria-label="Wenchi Motor Insurance home">
        <img src="Logo 1.0.png" alt="Wenchi Motor Insurance Logo" class="logo-img">
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-container">
      <h2>Create an Account</h2>
      <form id="signupForm">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fa-solid fa-user"></i></span>
            <input id="signupName" type="text" required />
          </div>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
            <input id="signupEmail" type="email" required />
          </div>
        </div>
        <div class="form-group">
          <label for="signupPhone">Phone (optional)</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fa-solid fa-phone"></i></span>
            <input id="signupPhone" type="tel" />
          </div>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
            <input id="signupPassword" type="password" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary-large">Sign Up</button>
      </form>
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
