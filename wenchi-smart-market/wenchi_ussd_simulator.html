
<style>
  .sim-wrap { display: flex; gap: 2rem; align-items: flex-start; padding: 1.5rem 0; flex-wrap: wrap; }
  .phone { width: 220px; flex-shrink: 0; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: 24px; padding: 1.25rem; display: flex; flex-direction: column; gap: 12px; }
  .screen { background: #1a1a1a; border-radius: 10px; min-height: 140px; padding: 12px; font-family: var(--font-mono); font-size: 12px; color: #b8e0a0; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .screen .prompt { color: #fff; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .key { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: 8px; padding: 8px 0; text-align: center; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--color-text-primary); transition: background 0.1s; user-select: none; }
  .key:active, .key.pressed { background: var(--color-background-tertiary); }
  .key.red { color: var(--color-text-danger); }
  .key.green { color: var(--color-text-success); }
  .input-row { display: flex; gap: 6px; }
  .ussd-input { flex: 1; font-family: var(--font-mono); font-size: 13px; }
  .send-btn { font-size: 12px; padding: 0 10px; background: var(--color-background-success); color: var(--color-text-success); border: 0.5px solid var(--color-border-success); border-radius: var(--border-radius-md); cursor: pointer; }

  .log-panel { flex: 1; min-width: 260px; }
  .log-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
  .log { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; font-size: 12px; font-family: var(--font-mono); min-height: 200px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .log-entry { display: flex; gap: 8px; }
  .log-entry .ts { color: var(--color-text-tertiary); flex-shrink: 0; }
  .log-entry .dir-in { color: var(--color-text-info); }
  .log-entry .dir-out { color: var(--color-text-success); }
  .state-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: var(--border-radius-md); background: var(--color-background-info); color: var(--color-text-info); margin-bottom: 8px; }
  .product-list { margin-top: 1rem; }
  .product-list-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; }
  .product-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 8px 12px; font-size: 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .product-card .name { font-weight: 500; color: var(--color-text-primary); }
  .product-card .meta { color: var(--color-text-secondary); }
  .badge-new { background: var(--color-background-success); color: var(--color-text-success); font-size: 10px; padding: 2px 6px; border-radius: var(--border-radius-md); }
  .reset-btn { font-size: 12px; margin-top: 8px; cursor: pointer; color: var(--color-text-secondary); background: none; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 4px 10px; }
</style>

<h2 class="sr-only">Wenchi Smart Market — USSD phone simulator for listing and viewing products</h2>

<div class="sim-wrap">
  <div class="phone">
    <div style="font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-align: center; letter-spacing: 0.05em;">WENCHI USSD SIM</div>
    <div class="screen" id="screen">Dial *384# to start</div>
    <div class="input-row">
      <input class="ussd-input" id="ussd-input" placeholder="*384#" />
      <button class="send-btn" onclick="handleSend()">SEND</button>
    </div>
    <div class="keypad" id="keypad">
      <div class="key" onclick="pressKey('1')">1</div>
      <div class="key" onclick="pressKey('2')">2</div>
      <div class="key" onclick="pressKey('3')">3</div>
      <div class="key" onclick="pressKey('4')">4</div>
      <div class="key" onclick="pressKey('5')">5</div>
      <div class="key" onclick="pressKey('6')">6</div>
      <div class="key" onclick="pressKey('7')">7</div>
      <div class="key" onclick="pressKey('8')">8</div>
      <div class="key" onclick="pressKey('9')">9</div>
      <div class="key red" onclick="pressKey('CLEAR')">CLR</div>
      <div class="key" onclick="pressKey('0')">0</div>
      <div class="key green" onclick="handleSend()">OK</div>
    </div>
    <button class="reset-btn" onclick="resetSim()">Reset session</button>
  </div>

  <div class="log-panel">
    <div id="state-badge" class="state-badge">idle</div>
    <div class="log-title">Session log</div>
    <div class="log" id="log"></div>

    <div class="product-list" id="product-list" style="display:none;">
      <div class="product-list-title">Listed products</div>
      <div id="product-cards"></div>
    </div>
  </div>
</div>

<script>
const PHONE = "260971234567";
let state = "idle";
let session = {};
let products = [];
let sessionId = null;

const MENUS = {
  main: `Welcome to Wenchi\n\n1. Register\n2. List Product\n3. My Products\n4. View Orders\n\nReply with number:`,
  register_name: `Enter your name:`,
  register_location: `Enter your market/location:`,
  register_done: (n, l) => `Registered!\nName: ${n}\nLocation: ${l}\n\nPress 0 to go back`,
  list_name: `Enter product name:`,
  list_price: `Enter price (K):`,
  list_qty: `Enter quantity available:`,
  list_location: `Enter location:`,
  list_done: (p) => `Product listed!\n\n${p.name}\nK${p.price} | Qty: ${p.qty}\n${p.location}\n\nPress 0 for menu`,
  my_products: (prods) => prods.length === 0
    ? `No products listed yet.\n\n0. Back to menu`
    : `Your products:\n\n${prods.map((p,i) => `${i+1}. ${p.name} - K${p.price}`).join('\n')}\n\n0. Back`,
  orders: `No orders yet.\nShare your USSD code\nwith buyers.\n\n0. Back`,
};

function ts() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

function log(dir, msg) {
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  const cls = dir === 'IN' ? 'dir-in' : 'dir-out';
  entry.innerHTML = `<span class="ts">${ts()}</span><span class="${cls}">[${dir}]</span><span>${msg}</span>`;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;
}

function setScreen(text) {
  document.getElementById('screen').textContent = text;
}

function setBadge(s) {
  document.getElementById('state-badge').textContent = s;
}

function renderProducts() {
  if (products.length === 0) { document.getElementById('product-list').style.display = 'none'; return; }
  document.getElementById('product-list').style.display = 'block';
  const container = document.getElementById('product-cards');
  container.innerHTML = products.map((p, i) => `
    <div class="product-card">
      <div>
        <span class="name">${p.name}</span>
        <span class="meta"> · ${p.location}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="meta">K${p.price} / qty:${p.qty}</span>
        ${i === products.length - 1 ? '<span class="badge-new">new</span>' : ''}
      </div>
    </div>
  `).join('');
}

function processInput(input) {
  input = input.trim();
  log('IN', input);

  if (state === 'idle') {
    if (input === '*384#') {
      state = 'main';
      sessionId = Math.random().toString(36).substr(2,8).toUpperCase();
      log('OUT', `Session ${sessionId} started`);
      setScreen(MENUS.main);
      setBadge('main_menu');
    } else {
      setScreen(`Invalid code.\nDial *384# to start`);
    }
    return;
  }

  if (input === '0' && ['register_done','list_done','my_products','orders'].includes(state)) {
    state = 'main'; setScreen(MENUS.main); setBadge('main_menu'); return;
  }

  switch(state) {
    case 'main':
      if (input === '1') { state = 'register_name'; setScreen(MENUS.register_name); setBadge('register'); }
      else if (input === '2') { state = 'list_name'; setScreen(MENUS.list_name); setBadge('list_product'); }
      else if (input === '3') { state = 'my_products'; setScreen(MENUS.my_products(products)); setBadge('my_products'); }
      else if (input === '4') { state = 'orders'; setScreen(MENUS.orders); setBadge('orders'); }
      else setScreen(`Invalid option.\n\n${MENUS.main}`);
      break;

    case 'register_name':
      session.reg_name = input; state = 'register_location'; setScreen(MENUS.register_location); break;

    case 'register_location':
      session.reg_location = input; state = 'register_done';
      log('OUT', `Seller registered: ${session.reg_name} @ ${session.reg_location}`);
      setScreen(MENUS.register_done(session.reg_name, session.reg_location)); break;

    case 'list_name':
      session.prod_name = input; state = 'list_price'; setScreen(MENUS.list_price); break;

    case 'list_price':
      if (isNaN(input) || Number(input) <= 0) { setScreen(`Invalid price.\nEnter a number (e.g. 50):`); return; }
      session.prod_price = input; state = 'list_qty'; setScreen(MENUS.list_qty); break;

    case 'list_qty':
      if (isNaN(input) || Number(input) <= 0) { setScreen(`Invalid quantity.\nEnter a number:`); return; }
      session.prod_qty = input; state = 'list_location'; setScreen(MENUS.list_location); break;

    case 'list_location':
      const newProd = { name: session.prod_name, price: session.prod_price, qty: session.prod_qty, location: input, ts: ts() };
      products.push(newProd);
      state = 'list_done';
      log('OUT', `Product stored: ${newProd.name} @ K${newProd.price}`);
      setScreen(MENUS.list_done(newProd));
      renderProducts();
      break;

    default:
      state = 'main'; setScreen(MENUS.main); setBadge('main_menu');
  }

  if (!['idle'].includes(state)) log('OUT', `State → ${state}`);
}

function handleSend() {
  const inp = document.getElementById('ussd-input');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  processInput(val);
}

function pressKey(k) {
  const inp = document.getElementById('ussd-input');
  if (k === 'CLEAR') { inp.value = inp.value.slice(0,-1); return; }
  inp.value += k;
  const el = event.currentTarget;
  el.classList.add('pressed');
  setTimeout(() => el.classList.remove('pressed'), 100);
}

function resetSim() {
  state = 'idle'; session = {}; sessionId = null;
  setScreen('Dial *384# to start');
  setBadge('idle');
  document.getElementById('log').innerHTML = '';
  document.getElementById('ussd-input').value = '';
}

document.getElementById('ussd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSend();
});
</script>
