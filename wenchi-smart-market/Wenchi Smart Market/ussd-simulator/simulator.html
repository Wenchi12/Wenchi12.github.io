<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wenchi Smart Market - USSD Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .phone {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .phone img {
            width: 28px;
        }
        .screen {
            background: #000;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            margin-bottom: 20px;
        }
        .ussd-response {
            font-family: monospace;
            white-space: pre-line;
            line-height: 1.4;
        }
        .input-group {
            margin-bottom: 15px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background: #28a745;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .session-info {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="phone">
        <h1 style="text-align: center; margin-bottom: 20px;"> <img src="phone.svg" alt="phone"> Wenchi Market</h1>
        
        <div class="session-info">
            Session ID: <span id="sessionId">1234567890</span><br>
            Phone: <span id="phoneNumber">+260123456789</span>
        </div>
        
        <div class="screen">
            <div id="ussdDisplay" class="ussd-response">
                Welcome to Wenchi Smart Market
                1. Register as Seller
                2. Browse Products
                3. View My Orders
            </div>
        </div>
        
        <div class="input-group">
            <input type="text" id="ussdInput" placeholder="Enter option (e.g., 1*2*3)" />
            <button onclick="sendUSSD()">Send</button>
            <button onclick="resetSession()">New Session</button>
        </div>
    </div>

    <script>
        let currentText = '';
        let sessionId = generateSessionId();

        function generateSessionId() {
            return Math.random().toString(36).substring(2, 15);
        }

        function updateDisplay() {
            document.getElementById('sessionId').textContent = sessionId;
        }

        async function sendUSSD() {
            const input = document.getElementById('ussdInput').value;
            currentText = input;
            
            try {
                const response = await fetch('http://localhost:3001/api/ussd', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        serviceCode: '*123#',
                        phoneNumber: '+260123456789',
                        text: currentText
                    })
                });
                
                const data = await response.json();
                document.getElementById('ussdDisplay').textContent = data.response.replace('CON ', '').replace('END ', '');
                
                // If response starts with END, it's the end of session
                if (data.response.startsWith('END')) {
                    document.getElementById('ussdInput').value = '';
                    setTimeout(() => {
                        resetSession();
                    }, 3000);
                }
                
            } catch (error) {
                document.getElementById('ussdDisplay').textContent = 'Error: Could not connect to server. Make sure the backend is running.';
                console.error('USSD Error:', error);
            }
        }

        function resetSession() {
            sessionId = generateSessionId();
            currentText = '';
            document.getElementById('ussdInput').value = '';
            document.getElementById('ussdDisplay').textContent = `Welcome to Wenchi Smart Market
1. Register as Seller
2. Browse Products
3. View My Orders`;
            updateDisplay();
        }

        // Initialize
        updateDisplay();
        
        // Allow Enter key to send
        document.getElementById('ussdInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendUSSD();
            }
        });
    </script>
</body>
</html>
